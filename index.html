<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zug-Quiz</title>
  <meta name="description" content="Erkenne die Baureihe anhand des Bildes.">
  <meta name="theme-color" content="#f4f1ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zug-Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">

    <!-- Startbildschirm -->
    <section id="start" class="screen screen-center">
      <img class="start-image" src="images/000_start.webp" alt="Zug am Bahnsteig" width="1200" height="1600">
      <h1>Zug-Quiz</h1>
      <p class="muted">Erkenne den Zugtyp anhand des Bildes.<br>Die Züge kommen zufällig, du hast <span class="nowrap">3 Leben 🚂🚂🚂</span>.<br>Sind alle weg, geht es von vorne los!</p>
      <div class="spacer"></div>
      <button id="start-btn" class="btn" type="button">Start</button>
      <button id="reset-btn" class="link-btn" type="button" hidden>Von vorne beginnen</button>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="screen" hidden>
      <header class="topbar">
        <span class="brand">Zug-Quiz</span>
        <span id="lives" class="lives" role="img" aria-label="3 Leben"><span>🚂</span><span>🚂</span><span>🚂</span></span>
        <span id="progress-text" class="progress-text">1 / 17</span>
      </header>
      <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress-bar"></div></div>

      <div class="card">
        <div id="card-inner" class="card-inner">
          <div class="face front">
            <div class="photo">
              <img id="train-image" alt="Foto eines Zuges – welche Baureihe ist das?">
            </div>
            <p class="question">Was ist das für ein Zug?</p>
          </div>
          <div class="face back" aria-live="polite">
            <h2 id="back-title"></h2>
            <div id="back-text" class="back-text"></div>
          </div>
        </div>
      </div>

      <p id="feedback" class="feedback" role="status"></p>

      <form id="answer-form" class="answer" autocomplete="off" novalidate>
        <label for="answer" class="visually-hidden">Baureihe</label>
        <input id="answer" class="answer-input" type="text" inputmode="numeric" pattern="[0-9]*"
               placeholder="Baureihe" enterkeyhint="go" autocomplete="off">
        <button id="action-btn" class="btn" type="submit" disabled>Prüfen</button>
      </form>
    </section>

    <!-- Ende -->
    <section id="finish" class="screen screen-center" hidden>
      <div class="spacer"></div>
      <svg class="check" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="26"/>
        <path d="M14 27 l8 8 l16 -17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Geschafft!</h1>
      <p class="muted">Du hast alle Züge richtig erkannt. 🚂🎉</p>
      <div class="spacer"></div>
      <button id="restart-btn" class="btn" type="button">Nochmal spielen</button>
    </section>

  </main>

  <script src="trains.js"></script>
  <script src="app.js"></script>
</body>
</html>
